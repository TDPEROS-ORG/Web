[build]
  command = "npm run build:netlify"
  publish = "netlify-dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "https://backend-production-2dca.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/operador"
  to = "/operador/index.html"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"