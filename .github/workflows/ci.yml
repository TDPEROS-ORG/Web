name: Web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t energia-web:ci .
      - name: Comprobar nginx y recursos
        run: |
          docker run -d --name energia-web-ci -p 127.0.0.1:8080:8080 -e API_UPSTREAM=https://example.com energia-web:ci
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8080/healthz
          for path in /operador /operador/assets/app.js /operador/assets/app.css /operador/assets/solar.jpg; do
            curl -fsS -o /dev/null "http://127.0.0.1:8080$path"
          done
      - name: Limpiar contenedor
        if: always()
        run: docker rm -f energia-web-ci