name: Web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t energia-web:ci .
      - name: Comprobar nginx y recursos
        run: |
          docker run -d --name energia-web-ci -p 127.0.0.1:8080:8080 -e API_UPSTREAM=https://example.com energia-web:ci
          curl --retry 10 --retry-all-errors --retry-delay 1 --max-time 10 --retry-max-time 30 -fsS http://127.0.0.1:8080/healthz
          for path in /operador /operador/assets/app.js /operador/assets/app.css /operador/assets/solar.jpg; do
            curl -fsS -o /dev/null "http://127.0.0.1:8080$path"
          done
      - name: Limpiar contenedor
        if: always()
        run: docker rm -f energia-web-ci
  netlify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:netlify
      - name: Comprobar publicacion Netlify
        run: |
          for path in _redirects index.html operador/index.html operador/assets/app.js operador/assets/app.css operador/assets/solar.jpg; do
            test -s "netlify-dist/$path"
          done